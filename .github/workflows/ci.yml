name: CI

# 触发策略：仅在推送版本 tag（如 v0.1.0）时触发完整 CI + 发布；
# 也保留 workflow_dispatch 手动触发（手动触发只构建测试，不创建 Release）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: cargo build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo check
        run: cargo check --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo build (release)
        run: cargo build --workspace --locked --release

      - name: 打包产物（Linux tar.gz + sha256）
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/agentos-license-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            -C target/release agentos-license-daemon agentos-license-checker
          cd dist && sha256sum "agentos-license-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            > "agentos-license-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"

      - name: 打包产物（Windows zip + sha256）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/agentos-license-${{ github.ref_name }}-windows-x86_64.zip"
          Compress-Archive -Path target/release/agentos-license-daemon.exe, target/release/agentos-license-checker.exe -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  agentos-license-${{ github.ref_name }}-windows-x86_64.zip" | Out-File -Encoding ascii "$zip.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  release:
    name: 发布 GitHub Release
    needs: build
    # 仅 tag 推送时发布；workflow_dispatch 手动触发（ref 是分支）时跳过
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release/

      - name: 创建 Release 并挂载产物
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
